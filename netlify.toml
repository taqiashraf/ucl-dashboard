[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "24"
  # Public configuration, not credentials. Keep FOOTBALL_API_KEY scanned.
  SECRETS_SCAN_OMIT_KEYS = "DATA_PROVIDER,ALLOWED_ORIGIN"
[functions]
  node_bundler = "esbuild"
[dev]
  command = "npm run preview -- --port 4179"
  targetPort = 4179
  port = 8888
  autoLaunch = false
[[redirects]]
  from = "/api/cl/*"
  to = "/.netlify/functions/cl/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://crests.football-data.org https://media.api-sports.io; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
