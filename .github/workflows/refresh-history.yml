name: Refresh season archive
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-history
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/update-history.mjs
      - run: npm run format
      - run: npm test && npm run build
      - name: Commit verified archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/history
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Champions League season archive'
            git push
          fi
      - name: Trigger configured Netlify build hook
        env:
          BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$BUILD_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$BUILD_HOOK" >/dev/null
          fi
